<div class="row justify-content-center"><section class="col-md-6 col-lg-5">
  <h2 class="h4 mb-3">Administrator sign in</h2>
  <p>Sign in to add, edit, or remove trip packages.</p>
  <p *ngIf="error" class="alert alert-danger" role="alert">{{ error }}</p>
  <form class="card card-body" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <label for="email" class="form-label">Email</label>
    <input id="email" class="form-control mb-2" type="email" formControlName="email" autocomplete="username">
    <p *ngIf="submitted && form.controls.email.invalid" class="text-danger">Enter your email address.</p>
    <label for="password" class="form-label mt-2">Password</label>
    <input id="password" class="form-control mb-2" type="password" formControlName="password" autocomplete="current-password">
    <p *ngIf="submitted && form.controls.password.invalid" class="text-danger">Enter your password.</p>
    <button type="submit" class="btn btn-primary mt-3" [disabled]="saving">{{ saving ? 'Signing in...' : 'Sign In' }}</button>
  </form>
</section></div>
