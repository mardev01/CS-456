<h2 class="h4 mb-3">Settings</h2><p>Update the name shown on your staff account.</p><p *ngIf="error" class="alert alert-danger" role="alert">{{error}}</p><p *ngIf="saved" class="alert alert-success" role="status">Your account name was saved.</p><p *ngIf="loading" role="status">Loading settings...</p>
<form *ngIf="!loading" class="card card-body" [formGroup]="form" (ngSubmit)="save()"><p><strong>Email</strong><br>{{email}}</p><label for="staff-name" class="form-label">Name</label><input id="staff-name" class="form-control mb-3" formControlName="name" maxlength="100"><button class="btn btn-primary align-self-start" type="submit" [disabled]="form.invalid || saving">{{saving ? 'Saving...' : 'Save Name'}}</button></form>
