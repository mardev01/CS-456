<header class="bg-dark text-white py-3"><div class="container-fluid px-4 d-flex justify-content-between align-items-center gap-3 flex-wrap">
<a routerLink="/" class="text-white text-decoration-none"><h1 class="h3 mb-0">{{ title }}</h1></a>
<div *ngIf="auth.currentUser() as user" class="d-flex align-items-center gap-3"><span>{{ user.name }}</span><button type="button" class="btn btn-outline-light btn-sm" (click)="logout()">Sign Out</button></div>
</div></header>
<div class="container-fluid"><div class="row">
<aside *ngIf="auth.isLoggedIn()" class="col-md-2 bg-white border-end py-4 px-3"><nav class="nav nav-pills flex-column gap-2" aria-label="Administrator navigation">
<a routerLink="/" [routerLinkActiveOptions]="{exact:true}" routerLinkActive="active" class="nav-link">Travel</a>
<a routerLink="/reservations" routerLinkActive="active" class="nav-link">Reservations</a>
<a routerLink="/customers" routerLinkActive="active" class="nav-link">Users</a>
<a routerLink="/settings" routerLinkActive="active" class="nav-link">Settings</a>
<a href="http://localhost:3000/" class="nav-link border-top mt-3 pt-3">Customer Website</a>
</nav></aside>
<main class="py-4 px-md-4" [ngClass]="auth.isLoggedIn() ? 'col-md-10' : 'col-12'"><router-outlet></router-outlet></main>
</div></div>
